name: Build planning platform images

on:
  push:
    tags:
      - v0.1.12

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: planning-platform-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLANNER_IMAGE: ghcr.io/rausserhq/planning-platform/planner
  PLANNER_TAG: v0.1.12
  WINDMILL_IMAGE: ghcr.io/rausserhq/planning-platform/windmill
  WINDMILL_TAG: v1.775.2-planning.13
  WINDMILL_BASE: ghcr.io/windmill-labs/windmill:1.775.2@sha256:ef39329523f4806e5cd5169ffa7af2618f39439bcf659115e8bb804c592d7132
  WINDMILL_SHA: 64ec1aa490ab5537a73bcb6f6b7e926c6339af39

jobs:
  planner:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push planner
        id: planner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/planner-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLANNER_IMAGE }}:${{ env.PLANNER_TAG }}
          build-args: |
            PLANNING_PLATFORM_VERSION=0.1.12
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=planning-platform-planner
          cache-to: type=gha,mode=max,scope=planning-platform-planner

      - name: Reject fixable critical planner vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PLANNER_IMAGE }}@${{ steps.planner.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Verify planner image contract
        env:
          IMAGE_DIGEST: ${{ steps.planner.outputs.digest }}
        run: |
          set -euo pipefail
          image="${PLANNER_IMAGE}:${PLANNER_TAG}@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "${image}"
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = "10001:10001"
          docker run --rm --platform linux/amd64 --entrypoint planning "${image}" --help
          echo "Planner: \`${image}\`" >>"${GITHUB_STEP_SUMMARY}"

  windmill:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out planning source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.27
          enable-cache: true

      - name: Build planning wheel
        run: |
          rm -rf dist
          uv build --wheel --out-dir dist
          uv export --frozen --no-dev --no-emit-project --no-header \
            --no-annotate --format requirements.txt \
            --output-file dist/requirements.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify official Windmill CE base identity
        run: |
          set -euo pipefail
          test "$(docker buildx imagetools inspect \
            --format '{{.Image.OS}}/{{.Image.Architecture}}' "${WINDMILL_BASE}")" = \
            "linux/amd64"
          labels="$(docker buildx imagetools inspect \
            --format '{{json .Image.Config.Labels}}' "${WINDMILL_BASE}")"
          test "$(jq -r '."org.opencontainers.image.version"' <<<"${labels}")" = "1.775.2"
          test "$(jq -r '."org.opencontainers.image.revision"' <<<"${labels}")" = "${WINDMILL_SHA}"
          test "$(jq -r '."org.opencontainers.image.source"' <<<"${labels}")" = \
            "https://github.com/windmill-labs/windmill"
          build_history="$(docker buildx imagetools inspect \
            --format '{{range .Image.History}}{{println .CreatedBy}}{{end}}' "${WINDMILL_BASE}")"
          grep -F 'features=ce' <<<"${build_history}" >/dev/null
          ! grep -F 'features=ee' <<<"${build_history}" >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the deterministic lifecycle package
        id: windmill
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/windmill/extend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WINDMILL_IMAGE }}:${{ env.WINDMILL_TAG }}
          build-args: |
            WINDMILL_BASE=${{ env.WINDMILL_BASE }}
            PLANNING_PLATFORM_VERSION=0.1.12
            NPM_VERSION=11.19.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=planning-platform-windmill-extension
          cache-to: type=gha,mode=max,scope=planning-platform-windmill-extension

      - name: Reject fixable critical Windmill vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WINDMILL_IMAGE }}@${{ steps.windmill.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Verify Windmill image contract
        env:
          IMAGE_DIGEST: ${{ steps.windmill.outputs.digest }}
        run: |
          set -euo pipefail
          image="${WINDMILL_IMAGE}:${WINDMILL_TAG}@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "${image}"
          test "$(docker image inspect --format '{{.Config.User}}' "${image}")" = "1000:1000"
          docker run --rm --platform linux/amd64 --entrypoint python3 "${image}" -c \
            'from importlib.metadata import version; from pathlib import Path; root = Path("/opt/planning-platform-workspace"); files = [path for path in root.rglob("*") if path.is_file()]; assert version("planning-platform") == "0.1.12"; assert len(files) == 46; assert (root / "wmill.yaml").is_file(); assert (root / "f/planning/github_webhook.http_trigger.yaml").is_file(); assert (root / "f/planning/openproject_webhook.http_trigger.yaml").is_file(); assert (root / "f/planning/alertmanager_webhook.http_trigger.yaml").is_file(); assert (root / "f/planning/nightly_reconciliation.schedule.yaml").is_file(); assert (root / "f/planning/convergence_check.flow/flow.yaml").is_file(); assert (root / "f/planning/replan_affected_subgraph.flow/flow.yaml").is_file(); assert (root / "f/planning/replan_event.py").is_file(); assert (root / "f/planning/replan_affected_subgraph.py").is_file()'
          docker run --rm --platform linux/amd64 --user 1000:1000 \
            --entrypoint wmill "${image}" --version \
            | grep -Fx 'CLI version: 1.775.2' >/dev/null
          test "$(docker run --rm --platform linux/amd64 --entrypoint npm "${image}" --version)" = "11.19.0"
          test "$(docker run --rm --platform linux/amd64 --entrypoint node "${image}" -p \
            'require("/usr/lib/node_modules/npm/node_modules/tar/package.json").version')" = "7.5.19"
          {
            echo "Windmill official CE base: \`${WINDMILL_BASE}\`"
            echo "Windmill source revision: \`${WINDMILL_SHA}\`"
            echo "Windmill runtime: \`${image}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
