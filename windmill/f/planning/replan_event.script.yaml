summary: Bind a bounded partial replan to the Windmill root job
description: Builds one trusted internal envelope without a caller-controlled delivery identity.
kind: script
lock: '!inline f/planning/replan_event.script.lock'
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    plan_id: {type: string, minLength: 1}
    base_plan_version: {type: integer, minimum: 1}
    affected_node_keys:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 1}
    reason: {type: string, minLength: 1, maxLength: 4096}
  required: [plan_id, base_plan_version, affected_node_keys, reason]
