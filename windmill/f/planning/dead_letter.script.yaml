summary: Record a terminal planning delivery failure
description: Persists only trusted event identity and sanitized failure classification.
kind: script
lock: '!inline f/planning/dead_letter.script.lock'
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    event:
      type: object
      additionalProperties: true
    error:
      type:
        - object
        - "null"
      additionalProperties: true
    preserve_failure:
      type: boolean
      default: false
  required:
    - event
